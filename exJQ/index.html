<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício JQuery</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Lista de Tarefas EBAC</h1>
    </header>
    <section>
      <div id="todo">
        <h2>Lista de tarefas</h2>
        <form>
          <input
            id="valor"
            type="text"
            placeholder="Adicione uma tarefa na lista"
          />
          <button id="add">Adicionar</button>
        </form>
        <div id="list"></div>
      </div>
    </section>
    <script src="https://code.jquery.com/jquery-4.1.0.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
